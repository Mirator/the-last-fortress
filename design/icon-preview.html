<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Last Fortress — icon study</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#19252d;color:#f0e7d5;font:16px/1.5 system-ui,sans-serif;padding:48px;max-width:1200px;margin-inline:auto}h1{font-size:32px;font-weight:600;margin:0 0 8px}p{color:#aebcb9;margin:0 0 32px}.icons{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px}.card{background:#25323a;border:1px solid #43504f;border-radius:10px;text-align:center;padding:26px 12px 18px}.card img{width:64px;height:64px;display:block;margin:0 auto 16px}.small{display:flex;gap:16px;justify-content:center;margin-top:18px;align-items:center}.small img{width:24px;height:24px;margin:0}.small img:last-child{width:32px;height:32px}.label{font-size:14px;color:#c7cec3}.builds{display:flex;flex-wrap:wrap;gap:12px;margin-top:38px}.build{display:flex;gap:14px;align-items:center;background:#25323a;border:1px solid #79c7c7;border-radius:8px;padding:16px 20px;min-width:200px}.build img{width:40px;height:40px}.price{color:#e9b45f}kbd{color:#aebcb9;font:12px system-ui;border:1px solid #58645f;border-radius:3px;padding:2px 6px;margin-left:12px}.note{margin-top:24px;font-size:13px}
</style>
<h1>The Last Fortress</h1>
<p>Simple HUD icon study · transparent SVG sources · 64, 32, and 24 px</p>
<div class="icons">
  <div class="card"><img src="icons/keep.svg" alt="Keep"><div class="label">Keep</div><div class="small"><img src="icons/keep.svg" alt=""><img src="icons/keep.svg" alt=""></div></div>
  <div class="card"><img src="icons/wall.svg" alt="Wall"><div class="label">Wall</div><div class="small"><img src="icons/wall.svg" alt=""><img src="icons/wall.svg" alt=""></div></div>
  <div class="card"><img src="icons/archer-tower.svg" alt="Archer Tower"><div class="label">Archer Tower</div><div class="small"><img src="icons/archer-tower.svg" alt=""><img src="icons/archer-tower.svg" alt=""></div></div>
  <div class="card"><img src="icons/grunt.svg" alt="Grunt"><div class="label">Grunt</div><div class="small"><img src="icons/grunt.svg" alt=""><img src="icons/grunt.svg" alt=""></div></div>
  <div class="card"><img src="icons/gold.svg" alt="Gold"><div class="label">Gold</div><div class="small"><img src="icons/gold.svg" alt=""><img src="icons/gold.svg" alt=""></div></div>
  <div class="card"><img src="icons/keep-health.svg" alt="Keep health"><div class="label">Keep health</div><div class="small"><img src="icons/keep-health.svg" alt=""><img src="icons/keep-health.svg" alt=""></div></div>
</div>
<div class="builds">
  <div class="build"><img src="icons/wall.svg" alt=""><div>Wall <kbd>1</kbd><div class="price">20 gold</div></div></div>
  <div class="build"><img src="icons/archer-tower.svg" alt=""><div>Archer Tower <kbd>2</kbd><div class="price">70 gold</div></div></div>
</div>
<p class="note">Static style study. Cards are illustrations of hierarchy, not functioning game controls.</p>
</html>
